<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravindu Stores | Shop Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Ravindu <span>Stores</span></div>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <nav id="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html" class="active">Shop</a>
            <a href="login.html" id="auth-nav-link">Sign In</a>
        </nav>
        <button class="cart-trigger-btn" onclick="toggleCart()">
            🛒 Cart (<span id="cart-count">0</span>)
        </button>
    </header>

    <main class="container" style="margin-top: 30px;">
        <div class="catalog-header">
            <h2>Complete Catalog</h2>
            <input type="text" id="searchInput" placeholder="Search products..." onkeyup="filterProducts()">
        </div>

        <div class="category-tabs">
            <button class="tab-btn active" onclick="setCategory('all', this)">All</button>
            <button class="tab-btn" onclick="setCategory('bags', this)">Bags</button>
            <button class="tab-btn" onclick="setCategory('clothing', this)">Apparel</button>
            <button class="tab-btn" onclick="setCategory('decor', this)">Decor</button>
            <button class="tab-btn" onclick="setCategory('accessories', this)">Accessories</button>
        </div>

        <div class="product-grid" id="product-container"></div>
    </main>

    <aside class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button class="close-btn" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Total:</span>
                <span id="cart-total">Rs. 0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Checkout</button>
        </div>
    </aside>

    <footer class="footer">
        <p>&copy; 2026 Ravindu Stores.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
