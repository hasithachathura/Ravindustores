<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ravindu Stores | Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Ravindu <span>Stores</span></div>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
        <nav id="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="login.html" class="active" id="auth-nav-link">Sign In</a>
        </nav>
        <button class="cart-trigger-btn" onclick="toggleCart()">
            🛒 Cart (<span id="cart-count">0</span>)
        </button>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-tabs">
                <button class="auth-tab-btn active" id="loginTabBtn" onclick="switchAuthTab('login')">Sign In</button>
                <button class="auth-tab-btn" id="signupTabBtn" onclick="switchAuthTab('signup')">Create Account</button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" required placeholder="••••••••">
                </div>
                <button type="submit" class="auth-btn">Sign In</button>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="hidden" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signupEmail" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signupPassword" minlength="6" required placeholder="••••••••">
                </div>
                <button type="submit" class="auth-btn">Create Account</button>
            </form>

            <div id="authStatus" class="auth-status"></div>
        </div>
    </main>

    <aside class="cart-drawer" id="cart-drawer">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button class="close-btn" onclick="toggleCart()">&times;</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Total:</span>
                <span id="cart-total">Rs. 0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Checkout</button>
        </div>
    </aside>

    <script src="app.js"></script>
</body>
</html>
